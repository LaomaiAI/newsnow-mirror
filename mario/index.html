<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>超级玛莉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#14141c;
        --panel:#1e1e2a;
        --line:#3a3a52;
        --ink:#f4f1e6;
        --dim:#9a97ad;
        --red:#e7402e;
        --gold:#f8b800;
        --teal:#00b3a4;
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0; background:var(--bg); color:var(--ink);
        font-family:"Press Start 2P", ui-monospace, Menlo, monospace;
        display:flex; flex-direction:column; overflow:hidden;
        height:100dvh;
      }
      /* ---------- top bar ---------- */
      header{
        display:flex; align-items:center; gap:10px;
        padding:5px 12px; flex:0 0 auto;
      }
      header .ttl{ font-size:11px; letter-spacing:1px; color:var(--ink); }
      header .ttl b{ color:var(--gold); font-weight:400; }
      header .sp{ flex:1; }
      .hbtn{
        appearance:none; border:2px solid var(--line); background:var(--panel);
        color:var(--ink); width:36px; height:36px; border-radius:6px;
        display:inline-flex; align-items:center; justify-content:center;
        cursor:pointer; padding:0;
      }
      .hbtn:active{ transform:translateY(1px); background:#26263a; }
      .hbtn svg{ width:18px; height:18px; fill:currentColor; }
      .hbtn.off{ color:var(--dim); }
      /* ---------- stage ---------- */
      #stage{
        flex:1 1 auto; position:relative; display:flex;
        align-items:center; justify-content:center; min-height:0;
        padding:2px 2px; background:#000;
      }
      #screen{
        position:relative; line-height:0;
        border:3px solid #000; border-radius:6px;
        box-shadow:0 0 0 3px #2c2c40, 0 18px 50px rgba(0,0,0,.55);
        background:#000; overflow:hidden;
      }
      canvas{
        display:block; image-rendering:pixelated; image-rendering:crisp-edges;
        background:#5c94fc;
      }
      #screen::after{ /* faint CRT scanlines */
        content:""; position:absolute; inset:0; pointer-events:none;
        background:repeating-linear-gradient(to bottom, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);
        mix-blend-mode:multiply;
      }
      /* ---------- overlays ---------- */
      .panel{
        position:absolute; inset:0; display:flex; flex-direction:column;
        align-items:center; justify-content:center; text-align:center;
        background:rgba(8,8,20,.72); line-height:1.5; padding:16px;
        z-index:5;
      }
      .panel[hidden]{ display:none; }
      .panel h1{
        margin:0 0 6px; font-size:clamp(20px,5.2vw,34px); font-weight:400;
        color:var(--gold); text-shadow:3px 3px 0 #7c0800, 6px 6px 0 rgba(0,0,0,.45);
        letter-spacing:2px;
      }
      .panel h2{
        margin:0 0 10px; font-size:clamp(15px,3.6vw,22px); font-weight:400;
        color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.6); letter-spacing:1px;
      }
      .panel p{ margin:4px 0; font-size:clamp(9px,2.2vw,11px); color:var(--ink); line-height:1.9; }
      .panel p.dim{ color:var(--dim); }
      .bigbtn{
        margin-top:14px; appearance:none; cursor:pointer;
        font:inherit; font-size:clamp(11px,2.6vw,14px);
        color:#fff; background:var(--red); border:0; border-radius:6px;
        padding:13px 26px; box-shadow:0 4px 0 #8f1408, 0 6px 14px rgba(0,0,0,.5);
        letter-spacing:1px;
      }
      .bigbtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8f1408; }
      .ghostbtn{
        margin-top:10px; appearance:none; cursor:pointer;
        font:inherit; font-size:clamp(9px,2.2vw,11px);
        color:var(--ink); background:transparent; border:2px solid var(--line);
        border-radius:6px; padding:10px 18px; letter-spacing:1px;
      }
      .ghostbtn:active{ background:var(--panel); }
      .blink{ animation:blink 1.1s steps(2,start) infinite; }
      @keyframes blink{ to{ visibility:hidden; } }
      @media (prefers-reduced-motion: reduce){ .blink{ animation:none; } }
      /* ---------- forced landscape (rotated frame) ---------- */
      #rot{
        display:flex; flex-direction:column; flex:1 1 auto;
        min-height:0; width:100%; position:relative;
      }
      /* Portrait viewport: rotate the whole app 90deg so the game is
         landscape and fills the screen — no fullscreen button needed.
         Width/height are also set in px from JS (checkOrient) so the
         frame matches the real viewport on every webview. */
      body.rotated #rot{
        position:fixed; left:50%; top:50%; flex:none;
        width:100vh; width:100dvh; height:100vw; height:100dvw;
        transform:translate(-50%,-50%) rotate(90deg);
      }
      body.rotated header{ padding:2px 10px; }
      body.rotated .hbtn{ width:32px; height:32px; }
      body.rotated #stage{ padding:0 2px; }
      body.rotated footer{ display:none; }
      /* ---------- touch controls: floating gamepad layer ----------
         The layer spans the WHOLE stage, not the game screen: the two
         clusters hug the left/right edges of the stage, so the buttons
         sit mostly on the black side bars and only straddle the edge
         of the picture — like thumbs resting on a gamepad while the
         screen floats in the middle. Semi-transparent, so whatever
         little of the picture they overlap stays visible. */
      #touch{
        position:absolute; inset:0; z-index:10;
        display:none; justify-content:space-between; align-items:flex-end;
        padding:0 14px 16px; pointer-events:none;
      }
      body.touch #touch{ display:flex; }
      .cluster{ display:flex; gap:12px; align-items:flex-end; pointer-events:none; }
      .tbtn{
        pointer-events:auto; touch-action:none; user-select:none; -webkit-user-select:none;
        display:flex; align-items:center; justify-content:center;
        background:rgba(24,24,38,.30); border:2px solid rgba(255,255,255,.26);
        color:rgba(255,255,255,.85); font:inherit; cursor:pointer;
        text-shadow:0 1px 2px rgba(0,0,0,.5);
      }
      .tbtn.on{ background:rgba(248,184,0,.6); border-color:var(--gold); }
      .dpad{ width:68px; height:68px; border-radius:12px; }
      .dpad svg{ width:28px; height:28px; fill:rgba(255,255,255,.85); }
      .ab{ border-radius:50%; flex-direction:column; gap:1px; }
      .ab small{ font-size:7px; color:rgba(255,255,255,.75); letter-spacing:0; }
      #btnA{ width:78px; height:78px; background:rgba(231,64,46,.34); border-color:rgba(255,160,150,.45); font-size:16px; }
      #btnA.on{ background:rgba(231,64,46,.88); }
      #btnB{ width:64px; height:64px; background:rgba(0,168,0,.30); border-color:rgba(150,255,150,.4); font-size:14px; margin-bottom:28px; }
      #btnB.on{ background:rgba(0,168,0,.85); }
      footer{
        flex:0 0 auto; text-align:center; padding:6px 10px calc(8px + env(safe-area-inset-bottom));
        font-size:8px; color:var(--dim); line-height:1.8; letter-spacing:.5px;
      }
      body.touch footer{ display:none; }
    </style>
  </head>
  <body>
    <div id="rot">
    <header>
      <div class="ttl">超级玛莉 <b>SUPER MALI</b></div>
      <div class="sp"></div>
      <button class="hbtn" id="btnPause" title="暂停 (P)" aria-label="暂停">
        <svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button class="hbtn" id="btnSound" title="声音开关" aria-label="声音开关">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </button>
    </header>

    <div id="stage">
      <div id="screen">
        <canvas id="game" width="400" height="240"></canvas>

        <div class="panel" id="titlePanel">
          <h1>超级玛莉</h1>
          <p>SUPER MALI</p>
          <p>跑 · 跳 · 踩怪 · 顶砖块 · 吃金币</p>
          <p>冲到终点，跳上旗杆过关！</p>
          <button class="bigbtn" id="btnStart">开始游戏</button>
          <p class="dim" style="margin-top:14px">命 ×5 · 失败从本关重来，不用回第一关<br/>键盘 ← → 移动 · 空格 跳 · Shift 疾跑/发火球</p>
        </div>

        <div class="panel" id="msgPanel" hidden>
          <h2 id="msgTitle">过关！</h2>
          <p id="msgBody"></p>
          <button class="bigbtn" id="msgBtn">下一关</button>
          <button class="ghostbtn" id="msgBtn2">重新开始</button>
        </div>

        <div class="panel" id="pausePanel" hidden>
          <h2>暂停</h2>
          <p class="dim">按 P 或点下面按钮继续</p>
          <button class="bigbtn" id="btnResume">继续游戏</button>
        </div>

      </div>

      <div id="touch">
        <div class="cluster">
          <button class="tbtn dpad" id="btnL" aria-label="向左"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8z"/></svg></button>
          <button class="tbtn dpad" id="btnR" aria-label="向右"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8z"/></svg></button>
        </div>
        <div class="cluster">
          <button class="tbtn ab" id="btnB" aria-label="疾跑/火球">B<small>疾跑·火球</small></button>
          <button class="tbtn ab" id="btnA" aria-label="跳跃">A<small>跳</small></button>
        </div>
      </div>
    </div>

    <footer>超级玛莉 SUPER MALI · 键盘：方向键/空格/Shift · 手机：横屏 + 虚拟按键</footer>
    </div><!-- /#rot -->

    <script>
    'use strict';
    /* ============================================================
       超级玛莉 SUPER MALI — 经典 8-bit 平台跳跃游戏
       Canvas 400x240 宽幅视野，整像素缩放，红白机式画风。
       ============================================================ */
    var T = 16;                 // tile size
    var VW = 400, VH = 240;     // view size — wide 25-tile view, so the picture fills the height of a landscape phone and spans 2/3+ of its width
    var MAPH = 15;
    var GRAV = 0.32;

    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    /* ---------------- sprite factory ---------------- */
    function mkCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
    function sprFromMap(rows, pal) {
      var h = rows.length, w = rows[0].length;
      var c = mkCanvas(w, h), g = c.getContext('2d');
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
        var ch = rows[y].charAt(x);
        if (ch === '.' || ch === ' ') continue;
        g.fillStyle = pal[ch] || '#f0f';
        g.fillRect(x, y, 1, 1);
      }
      return c;
    }
    function sprDraw(w, h, fn) { var c = mkCanvas(w, h); fn(c.getContext('2d'), w, h); return c; }

    /* ---------------- hero sprites (original character) ---------------- */
    var HERO_PAL = { C:'#e7402e', S:'#ffc9a3', E:'#20242c', R:'#e7402e', B:'#2b4bd8', N:'#7a3c10' };
    var FIRE_PAL = { C:'#f4f1e6', S:'#ffc9a3', E:'#20242c', R:'#e7402e', B:'#f87858', N:'#7a3c10' };

    var SMALL_HEAD = [
      "................",
      ".....CCCCCC.....",
      "....CCCCCCCCCC..",
      "...SSSSSSSSSS...",
      "...SESSSESSS....",
      "....SSSSSS......",
      "....RRRRRRR.....",
      "...RRRRRRRRR....",
      "...RRBBBBBRR....",
      "....BBBBBBB....."
    ];
    var SMALL_LEGS = {
      stand: [
        "....BBB.BBB.....",
        "....BBB.BBB.....",
        "...NNN...NNN....",
        "..NNNN...NNNN...",
        "................",
        "................"
      ],
      runA: [
        "....BBB...BBB...",
        "...BBB.....BBB..",
        "..NNN.......NN..",
        ".NNNN.......NNN.",
        "................",
        "................"
      ],
      runB: [
        ".....BBBBBB.....",
        "......BBBB......",
        ".....NN..NN.....",
        "....NNN..NNN....",
        "................",
        "................"
      ],
      runC: [
        ".....BBBBBB.....",
        ".....BBBBB......",
        ".....NNN.NN.....",
        "....NNNN........",
        "................",
        "................"
      ],
      jump: [
        "....BBBBBBB.....",
        "....BBB.BBB.....",
        "....NNN.NNN.....",
        "................",
        "................",
        "................"
      ]
    };
    function heroSet(pal, head, legs) {
      var o = {};
      for (var k in legs) o[k] = sprFromMap(head.concat(legs[k]), pal);
      return o;
    }
    /* Big / fire forms: the SMALL character scaled up as a whole by
       1.5x (16x16 -> 24x24). Head, torso and legs all grow together
       in the small form's own proportions — the legs are the small
       form's short chunky legs, just bigger, never separately drawn
       long sticks bolted under a small body. The scale is 1.5x, not
       2x, so the big form stands 24px tall (not 32) while being
       wider and chunkier overall. Collision follows the picture:
       14x22 instead of the old 12x30. */
    var BIG_W = 14, BIG_H = 22;
    function scaledSet(set, s) {
      var o = {};
      for (var k in set) {
        var src = set[k];
        var c = mkCanvas(Math.round(src.width * s), Math.round(src.height * s));
        var g = c.getContext('2d');
        g.imageSmoothingEnabled = false;
        g.drawImage(src, 0, 0, c.width, c.height);
        o[k] = c;
      }
      return o;
    }
    var SPR = {
      small: heroSet(HERO_PAL, SMALL_HEAD, SMALL_LEGS),
      big:   null,
      fire:  null
    };
    SPR.big = scaledSet(SPR.small, 1.5);
    SPR.fire = scaledSet(heroSet(FIRE_PAL, SMALL_HEAD, SMALL_LEGS), 1.5);

    /* ---------------- enemy / item sprites ---------------- */
    var BUG_PAL = { O:'#c84c0c', D:'#5c2e0c', W:'#ffffff', K:'#20242c' };
    var bugA = sprFromMap([
      "................",
      ".....OOOOOO.....",
      "..OOOOOOOOOO....",
      "..OWKOOOOKWO....",
      "..OOOOOOOOOO....",
      "..OOODDDDOOO....",
      "..OOOOOOOOOO....",
      "...OOOOOOOO.....",
      "...OOOOOOOO.....",
      "..DD..DD..DD....",
      ".DDD..DD..DDD...",
      "................",
      "................",
      "................",
      "................",
      "................"
    ], BUG_PAL);
    var bugB = sprFromMap([
      "................",
      ".....OOOOOO.....",
      "..OOOOOOOOOO....",
      "..OWKOOOOKWO....",
      "..OOOOOOOOOO....",
      "..OOODDDDOOO....",
      "..OOOOOOOOOO....",
      "...OOOOOOOO.....",
      "...OOOOOOOO.....",
      "....DD..DD......",
      "...DDD..DDD.....",
      "................",
      "................",
      "................",
      "................",
      "................"
    ], BUG_PAL);
    var bugFlat = sprFromMap([
      "................",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................",
      "...OOOOOOOO.....",
      "..OOOOOOOOOO....",
      ".DDODDODDODDO...",
      "................",
      "................"
    ], BUG_PAL);

    var TURT_PAL = { G:'#00a800', d:'#005000', W:'#b8f0a0', H:'#ffe0a8', E:'#20242c', D:'#005000' };
    var turtA = sprFromMap([
      "................",
      "....GGGGGGGG....",
      "..GGGGGGGGGGGG..",
      "..GWGGGGGGGGGG..",
      ".HHHGGGGGGGGGG..",
      ".HEHHGGGGGGGdG..",
      ".HHHHGGGGGGGGG..",
      "..GGGGGGGGGGGG..",
      "...GGGGGGGGGG...",
      "....D......D....",
      "...DD......DD...",
      "................",
      "................",
      "................",
      "................",
      "................"
    ], TURT_PAL);
    var turtB = sprFromMap([
      "................",
      "....GGGGGGGG....",
      "..GGGGGGGGGGGG..",
      "..GWGGGGGGGGGG..",
      ".HHHGGGGGGGGGG..",
      ".HEHHGGGGGGGdG..",
      ".HHHHGGGGGGGGG..",
      "..GGGGGGGGGGGG..",
      "...GGGGGGGGGG...",
      ".....D....D.....",
      "....DD....DD....",
      "................",
      "................",
      "................",
      "................",
      "................"
    ], TURT_PAL);
    var shellSpr = sprFromMap([
      "................",
      "................",
      "................",
      "................",
      "....GGGGGGGG....",
      "..GGGGGGGGGGGG..",
      "..GWGGGGGGdGGG..",
      "..GGGGGGGGGGGG..",
      "...GGGGGGGGGG...",
      "....DDDDDDDD....",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................"
    ], TURT_PAL);

    var berrySpr = sprFromMap([
      "................",
      "......LL........",
      ".....LLLL.......",
      "....RRRRRR......",
      "...RRRRRRRR.....",
      "..RRRRRRRRRR....",
      "..RWRRRRRRRR....",
      "..RRRRRRRRRR....",
      "...RRRRRRRR.....",
      "....RRRRRR......",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................"
    ], { L:'#00a800', R:'#e7402e', W:'#ffffff' });
    var fireFruitSpr = sprFromMap([
      "................",
      ".......FF.......",
      "......FFFF......",
      "......FYFF......",
      ".....FFYYFF.....",
      ".....FYYYYF.....",
      "....FFYYYYFF....",
      "....FFFFFFFF....",
      "...FFFFFFFFFF...",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................",
      "................"
    ], { F:'#f87818', Y:'#fcd858' });

    function coinFrame(w) {
      return sprDraw(16, 16, function (g) {
        var cx = 8, x0 = cx - w / 2;
        g.fillStyle = '#f8b800'; g.fillRect(x0, 2, w, 12);
        g.fillStyle = '#fcd858'; if (w > 3) g.fillRect(x0 + 1, 3, Math.max(1, w - 3), 10);
        g.fillStyle = '#9c5a00'; g.fillRect(x0, 2, w, 1); g.fillRect(x0, 13, w, 1);
        if (w > 5) { g.fillStyle = '#fff2b0'; g.fillRect(cx - 1, 4, 2, 8); }
      });
    }
    var coinSprs = [coinFrame(11), coinFrame(7), coinFrame(3), coinFrame(7)];
    var fireballSpr = sprDraw(8, 8, function (g) {
      g.fillStyle = '#f87818'; g.fillRect(1, 1, 6, 6); g.fillRect(0, 2, 8, 4); g.fillRect(2, 0, 4, 8);
      g.fillStyle = '#fcd858'; g.fillRect(2, 2, 4, 4);
      g.fillStyle = '#ffffff'; g.fillRect(3, 3, 2, 2);
    });

    /* ---------------- tile sprites ---------------- */
    function tileGround(top) {
      return sprDraw(16, 16, function (g) {
        g.fillStyle = '#c84c0c'; g.fillRect(0, 0, 16, 16);
        g.fillStyle = '#000'; g.fillRect(2, 5, 3, 2); g.fillRect(10, 10, 3, 2); g.fillRect(5, 12, 2, 2);
        g.fillStyle = '#fca044'; g.fillRect(7, 4, 2, 2); g.fillRect(13, 6, 2, 2); g.fillRect(1, 11, 2, 2);
        if (top) { g.fillStyle = '#fca044'; g.fillRect(0, 0, 16, 4); g.fillStyle = '#000'; g.fillRect(0, 4, 16, 1); }
      });
    }
    var TILE_SPR = {};
    TILE_SPR['#'] = tileGround(true);
    TILE_SPR['g'] = tileGround(false);
    TILE_SPR['B'] = sprDraw(16, 16, function (g) {
      g.fillStyle = '#c84c0c'; g.fillRect(0, 0, 16, 16);
      g.fillStyle = '#000';
      g.fillRect(0, 0, 16, 1); g.fillRect(0, 5, 16, 1); g.fillRect(0, 10, 16, 1); g.fillRect(0, 15, 16, 1);
      g.fillRect(8, 1, 1, 4); g.fillRect(4, 6, 1, 4); g.fillRect(12, 6, 1, 4); g.fillRect(8, 11, 1, 4);
      g.fillStyle = '#fca044'; g.fillRect(1, 1, 6, 1); g.fillRect(10, 6, 5, 1); g.fillRect(1, 11, 6, 1);
    });
    TILE_SPR['U'] = sprDraw(16, 16, function (g) {
      g.fillStyle = '#9c4a08'; g.fillRect(0, 0, 16, 16);
      g.fillStyle = '#000'; g.fillRect(0, 0, 16, 1); g.fillRect(0, 15, 16, 1); g.fillRect(0, 0, 1, 16); g.fillRect(15, 0, 1, 16);
      g.fillStyle = '#5c2e0c';
      g.fillRect(2, 2, 2, 2); g.fillRect(12, 2, 2, 2); g.fillRect(2, 12, 2, 2); g.fillRect(12, 12, 2, 2);
    });
    var QMAP = [".XXX.","X...X","....X","...X.","..X..",".....","..X.."];
    function qBlock() {
      return sprDraw(16, 16, function (g) {
        g.fillStyle = '#f8b800'; g.fillRect(0, 0, 16, 16);
        g.fillStyle = '#000'; g.fillRect(0, 0, 16, 1); g.fillRect(0, 15, 16, 1); g.fillRect(0, 0, 1, 16); g.fillRect(15, 0, 1, 16);
        g.fillStyle = '#9c5a00';

    /* ---------------- enemies & items ---------------- */
    function killEnemy(e, byStomp, byFire) {
      if (byFire || !byStomp) {
        e.dead = true; e.flip = true; e.vy = -4; e.vx = 0; addScore(100, e.x, e.y - 8);
        if (byFire) SFX.stomp();
      }
    }
    function updateEnemies() {
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (e.flip) { e.vy += GRAV; e.y += e.vy; if (e.y > MAPH * T + 60) enemies.splice(i, 1), i--; continue; }
        if (e.dead) { e.animT++; if (e.animT > 22) { enemies.splice(i, 1); i--; } continue; }
        if (!e.active) {
          if (e.x - camX < VW + 40) e.active = true; else continue;
        }
        e.animT++;
        if (e.mode === 'shell') {
          if (Math.abs(e.vx) < 0.1) {
            e.wakeT++;
            if (e.wakeT > 480) { e.mode = 'walk'; e.kind = 'turtle'; e.vx = -0.35; e.wakeT = 0; }
          }
        }
        e.vy = Math.min(e.vy + GRAV, 7);
        var res = moveEntity(e, false);
        if (res.wall) e.vx = -e.vx;
        if (e.y > MAPH * T + 40) { enemies.splice(i, 1); i--; continue; }

        /* shell kills others */
        if (e.mode === 'shell' && Math.abs(e.vx) > 0.5) {
          for (var j = 0; j < enemies.length; j++) {
            var o = enemies[j];
            if (o !== e && !o.dead && !o.flip && o.active && overlap(e, o)) {
              o.dead = true; o.flip = true; o.vy = -4; o.vx = 0; addScore(100, o.x, o.y - 8); SFX.stomp();
            }
          }
        }
        /* enemy vs enemy: turn around */
        for (var k = 0; k < enemies.length; k++) {
          var q = enemies[k];
          if (q !== e && !q.dead && !q.flip && q.mode !== 'shell' && e.mode !== 'shell' && overlap(e, q)) {
            e.vx = Math.abs(e.vx) * (e.x < q.x ? -1 : 1);
            q.vx = Math.abs(q.vx) * (q.x < e.x ? -1 : 1);
          }
        }

        /* player contact */
        if (state === 'play' && overlap(player, e)) {
          var stomp = player.vy > 0.4 && (player.y + player.h) - e.y < 11;
          if (e.mode === 'shell') {
            if (Math.abs(e.vx) < 0.1) {
              var dir = (player.x + player.w / 2) < (e.x + e.w / 2) ? 1 : -1;
              e.vx = dir * 3.2; e.x += dir * 2; SFX.kick(); addScore(100, e.x, e.y - 8);
              if (stomp) player.vy = keys.jump ? -6 : -3.4;
            } else if (stomp) {
              e.vx = 0; player.vy = keys.jump ? -6 : -3.4; SFX.stomp();
            } else hurtPlayer();
          } else if (stomp) {
            if (e.kind === 'turtle') {
              e.mode = 'shell'; e.vx = 0; e.wakeT = 0; SFX.stomp(); addScore(100, e.x, e.y - 8);
            } else {
              e.dead = true; e.animT = 0; addScore(100, e.x, e.y - 8); SFX.stomp();
            }
            player.vy = keys.jump ? -6.2 : -3.4;
            poof(e.x, e.y);
          } else hurtPlayer();
        }
      }
    }
    function updateItems() {
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.rise > 0) { it.y -= 0.6; it.rise -= 0.6; }
        else {
          if (it.kind === 'berry') {
            if (it.vx === 0) it.vx = 0.55;
            it.vy = Math.min(it.vy + GRAV, 6);
            var r = moveEntity(it, false);
            if (r.wall) it.vx = -it.vx;
          }
        }
        if (it.y > MAPH * T + 40) { items.splice(i, 1); i--; continue; }
        if (state === 'play' && it.rise <= 0 && overlap(player, it)) {
          items.splice(i, 1); i--;
          addScore(1000, player.x, player.y - 10);
          if (it.kind === 'berry') {
            if (player.form === 0) { player.form = 1; player.y -= (BIG_H - 15); player.h = BIG_H; player.w = BIG_W; player.x -= 1; }
            SFX.power();
          } else {
            if (player.form === 0) { player.form = 1; player.y -= (BIG_H - 15); player.h = BIG_H; player.w = BIG_W; player.x -= 1; }
            player.form = 2; SFX.power();
          }
        }
      }
    }
    function updateFireballs() {
      for (var i = 0; i < fireballs.length; i++) {
        var f = fireballs[i];
        f.vy = Math.min(f.vy + GRAV * 0.8, 6);
        var wasGround = f.onGround;
        var r = moveEntity(f, false);
        if (f.onGround) f.vy = -2.6;
        if (r.wall || f.y > MAPH * T + 30) {
          parts.push({ x: f.x + 4, y: f.y + 4, vx: 0, vy: 0, t: 0, spark: true });
          fireballs.splice(i, 1); i--; continue;
        }
        for (var j = 0; j < enemies.length; j++) {
          var e = enemies[j];
          if (!e.dead && !e.flip && e.active && overlap(f, e)) {
            e.dead = true; e.flip = true; e.vy = -4; e.vx = 0; addScore(100, e.x, e.y - 8); SFX.stomp();
            fireballs.splice(i, 1); i--; break;
          }
        }
      }
    }

    /* ---------------- clear sequence ---------------- */
    function startClear() {
      if (state !== 'play') return;
      state = 'clear'; clearPhase = 0; clearTimer = 0;
      player.x = flagTileX * T - player.w - 2; player.vx = 0;
      bgmStop(); SFX.clear();
    }
    function updateClear() {
      clearTimer++;
      var doorX = castleX * T + 22;
      if (clearPhase === 0) {
        if (flagY < 11 * T) flagY += 2.2;
        player.vy = Math.min(player.vy + GRAV, 7);
        moveEntity(player, true);
        if (flagY >= 11 * T && player.onGround) { clearPhase = 1; clearTimer = 0; }
      } else if (clearPhase === 1) {
        if (clearTimer > 25) {
          player.face = 1; player.vx = 1.0;
          player.vy = Math.min(player.vy + GRAV, 7);
          moveEntity(player, true);
          player.animT += 1;
          if (player.x >= doorX) { clearPhase = 2; clearTimer = 0; }
        }
      } else if (clearPhase === 2) {
        if (timeLeft > 0) {
          var d = Math.min(3, timeLeft); timeLeft -= d; score += d * 10;
        } else if (clearTimer > 40) {
          state = 'win';
          showMsg('过关！',
            '得分 ' + pad6(score) + '<br/>剩余时间奖励已计入<br/>金币 × ' + pad2(coinCount) + '<br/>剩余命 × ' + lives,
            '下一关 1-' + (level + 1), true, 'next');
        }
      }
    }

    /* ---------------- main update ---------------- */
    function update() {
      frame++;
      if (state === 'intro') {
        introTimer++;
        if (introTimer > 100) { state = 'play'; if (soundOn) bgmStart(); }
      }
      if (state === 'win' && frame % 22 === 0) {
        var fx = castleX * T + 8 + Math.random() * 64, fy = 36 + Math.random() * 52;
        var fcols = ['#f8b800', '#e7402e', '#00b3a4', '#ffffff', '#f87858'];
        for (var fi = 0; fi < 14; fi++) {
          var ang = (fi / 14) * Math.PI * 2, sp = 0.7 + Math.random() * 1.1;
          parts.push({ x: fx, y: fy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, t: 0, fw: true, col: fcols[fi % fcols.length] });
        }
      }
      if (state === 'play') {
        updatePlayer();
        updateEnemies();
        updateItems();
        updateFireballs();
      } else if (state === 'dead') {
        deadTimer++;
        if (player.y <= MAPH * T + 60) {
          if (deadTimer > 12) { player.vy = Math.min(player.vy + GRAV * 0.8, 8); player.y += player.vy; }
        }
        if (deadTimer > 95) {
          lives--;
          if (lives < 0) {
            state = 'over';
            showMsg('游戏结束', '最终得分 ' + pad6(score) + '<br/>到达关卡 1-' + level + '<br/>命已用完，可以从本关继续', '从 1-' + level + ' 继续', true, 'continue');
          } else {
            resetLevel(0); beginLevel();
          }
        }
      } else if (state === 'clear') {
        updateClear();
        updateFireballs();
      }
      /* particles / pops / bumps */
      for (var i = parts.length - 1; i >= 0; i--) {
        var pt = parts[i]; pt.t++;
        if (pt.brick) { pt.vy += 0.35; pt.x += pt.vx; pt.y += pt.vy; if (pt.t > 40) parts.splice(i, 1); }
        else if (pt.fw) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.03; if (pt.t > 55) parts.splice(i, 1); }
        else if (pt.dust) { pt.x += pt.vx; pt.y += pt.vy; if (pt.t > 10) parts.splice(i, 1); }
        else if (pt.t > 12) parts.splice(i, 1);
      }
      for (var j = pops.length - 1; j >= 0; j--) {
        var pp = pops[j]; pp.t++; pp.y -= 0.55;
        if (pp.t > 42) pops.splice(j, 1);
      }
      for (var b = bumps.length - 1; b >= 0; b--) { bumps[b].t++; if (bumps[b].t > 9) bumps.splice(b, 1); }

      /* camera */
      var target = player.x + player.w / 2 - VW / 2 + 30;
      if (target > camX) camX = target;
      var maxCam = MAPW * T - VW;
      if (camX > maxCam) camX = maxCam;
      if (camX < 0) camX = 0;
    }

    /* ---------------- rendering ---------------- */
    function pad6(n) { var s = '' + Math.floor(n); while (s.length < 6) s = '0' + s; return s; }
    function pad2(n) { var s = '' + n; while (s.length < 2) s = '0' + s; return s; }

    function drawBackground() {
      var sky = SKIES[(level - 1) % SKIES.length];
      ctx.fillStyle = sky; ctx.fillRect(0, 0, VW, VH);
      if ((level - 1) % SKIES.length === 2) { /* night: stars + crescent moon */
        ctx.fillStyle = '#ffffff';
        for (var si = 0; si < 64; si++) {
          var sx = ((si * 61 + 23) - Math.floor(camX * 0.3)) % VW; if (sx < 0) sx += VW;
          var sy = 8 + (si * 41) % 96;
          if ((si + Math.floor(frame / 30)) % 6 !== 0) ctx.fillRect(sx, sy, 2, 2);
        }
        ctx.fillStyle = '#f8e9b0';
        ctx.fillRect(VW - 64, 30, 14, 14); ctx.fillRect(VW - 67, 33, 20, 8);
        ctx.fillStyle = sky; ctx.fillRect(VW - 58, 31, 12, 12);
      }
      /* clouds (parallax) */
      ctx.fillStyle = '#ffffff';
      var off = -Math.floor(camX * 0.5) % 240;
      for (var i = -1; i < 3; i++) {
        var bx = off + i * 240;
        cloud(bx + 30, 30); cloud(bx + 150, 52); cloud(bx + 205, 24);
      }
      /* hills & bushes in world space */
      for (var hx = 0; hx < MAPW; hx += 19) {
        var wx = hx * T - camX;
        if (wx < -90 || wx > VW + 10) continue;
        if ((hx / 19) % 2 === 0) hill(wx, 13 * T);
        else bush(wx, 13 * T);
      }
    }
    function cloud(x, y) {
      ctx.fillRect(x, y + 4, 40, 8); ctx.fillRect(x + 6, y, 26, 12); ctx.fillRect(x + 12, y - 3, 12, 3);
    }
    function hill(x, gy) {
      ctx.fillStyle = '#00a800';
      ctx.beginPath();
      ctx.moveTo(x, gy); ctx.lineTo(x + 40, gy - 32); ctx.lineTo(x + 80, gy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#005000'; ctx.fillRect(x + 38, gy - 26, 3, 3); ctx.fillRect(x + 30, gy - 16, 3, 3); ctx.fillRect(x + 47, gy - 16, 3, 3);
    }
    function bush(x, gy) {
      ctx.fillStyle = '#00a800';
      ctx.fillRect(x, gy - 8, 44, 8); ctx.fillRect(x + 6, gy - 12, 30, 12);
      ctx.fillStyle = '#80d010'; ctx.fillRect(x + 8, gy - 10, 8, 3);
    }
    function drawCastle() {
      var x = castleX * T - camX, gy = 13 * T;
      if (x < -90 || x > VW + 20) return;
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(x, gy - 64, 80, 64);
      ctx.fillRect(x + 24, gy - 88, 32, 24);
      ctx.fillStyle = '#000';
      ctx.fillRect(x, gy - 64, 80, 3); ctx.fillRect(x + 24, gy - 88, 32, 3);
      ctx.fillRect(x + 33, gy - 26, 14, 26);           /* door */
      ctx.fillRect(x + 8, gy - 52, 10, 10); ctx.fillRect(x + 62, gy - 52, 10, 10); /* windows */
      ctx.fillStyle = '#fca044';
      for (var i = 0; i < 5; i++) { ctx.fillRect(x + i * 16 + 2, gy - 58, 10, 2); ctx.fillRect(x + i * 16 + 2, gy - 40, 10, 2); }
      /* battlements */
      ctx.fillStyle = '#c84c0c';
      for (var j = 0; j < 5; j++) ctx.fillRect(x + j * 16, gy - 72, 10, 8);
      for (var k = 0; k < 2; k++) ctx.fillRect(x + 24 + k * 20, gy - 96, 10, 8);
      /* pole + small flag */
      ctx.fillStyle = '#005000'; ctx.fillRect(x + 39, gy - 112, 2, 16);
      ctx.fillStyle = state === 'win' || clearPhase >= 2 ? '#e7402e' : '#888';
      ctx.fillRect(x + 41, gy - 112, 10, 6);
    }
    function drawFlag() {
      var x = flagTileX * T + 7 - camX;
      if (x < -20 || x > VW + 20) return;
      ctx.fillStyle = '#0a7a0a'; ctx.fillRect(x, 2 * T, 2, 11 * T);
      ctx.fillStyle = '#00a800'; ctx.fillRect(x - 3, 2 * T - 6, 8, 8);
      ctx.fillStyle = '#005000'; ctx.fillRect(x - 3, 2 * T - 6, 8, 1);
      /* cloth */
      ctx.fillStyle = '#00a800';
      var cy = flagY;
      ctx.fillRect(x - 13, cy, 13, 10);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - 10, cy + 3, 4, 4);
    }
    function bumpOffset(tx, ty) {
      for (var i = 0; i < bumps.length; i++)
        if (bumps[i].tx === tx && bumps[i].ty === ty)
          return -Math.sin((bumps[i].t / 9) * Math.PI) * 5;
      return 0;
    }
    function drawTiles() {
      var tx0 = Math.max(0, Math.floor(camX / T)), tx1 = Math.min(MAPW - 1, tx0 + Math.ceil(VW / T) + 1);
      for (var ty = 0; ty < MAPH; ty++) {
        for (var tx = tx0; tx <= tx1; tx++) {
          var ch = map[ty][tx];
          var dx = tx * T - camX, dy = ty * T;
          if (ch === 'C') {
            var f = coinSprs[Math.floor(frame / 8) % 4];
            ctx.drawImage(f, dx, dy);
          } else if (TILE_SPR[ch]) {
            ctx.drawImage(TILE_SPR[ch], dx, dy + bumpOffset(tx, ty));
          }
        }
      }
    }
    function drawEntities() {
      var i, e, it, f;
      for (i = 0; i < items.length; i++) {
        it = items[i];
        ctx.drawImage(it.kind === 'berry' ? berrySpr : fireFruitSpr, Math.round(it.x - 1 - camX), Math.round(it.y - 2));
      }
      for (i = 0; i < enemies.length; i++) {
        e = enemies[i];
        if (!e.active && !e.flip) continue;
        var dx = Math.round(e.x - 1 - camX), dy = Math.round(e.y - 2);
        ctx.save();
        if (e.flip) { ctx.translate(dx + 8, dy + 8); ctx.scale(1, -1); ctx.translate(-(dx + 8), -(dy + 8)); }
        if (e.mode === 'shell') ctx.drawImage(shellSpr, dx, dy);
        else if (e.dead) ctx.drawImage(bugFlat, dx, dy);
        else if (e.kind === 'turtle') ctx.drawImage(Math.floor(e.animT / 16) % 2 ? turtA : turtB, dx, dy);
        else ctx.drawImage(Math.floor(e.animT / 12) % 2 ? bugA : bugB, dx, dy);
        ctx.restore();
      }
      for (i = 0; i < fireballs.length; i++) {
        f = fireballs[i];
        ctx.drawImage(fireballSpr, Math.round(f.x - camX), Math.round(f.y));
      }
      for (i = 0; i < parts.length; i++) {
        var pt = parts[i];
        if (pt.brick) { ctx.fillStyle = '#c84c0c'; ctx.fillRect(Math.round(pt.x - camX), Math.round(pt.y), 6, 6); ctx.fillStyle = '#000'; ctx.fillRect(Math.round(pt.x - camX), Math.round(pt.y), 6, 1); }
        else if (pt.fw) { ctx.fillStyle = pt.col; ctx.fillRect(Math.round(pt.x - camX) - 1, Math.round(pt.y), 3, 3); }
        else if (pt.dust) { ctx.fillStyle = 'rgba(232,224,204,.85)'; ctx.fillRect(Math.round(pt.x - camX) - 1, Math.round(pt.y), 3, 3); }
        else { ctx.fillStyle = '#fcd858'; ctx.fillRect(Math.round(pt.x - camX) - 2, Math.round(pt.y), 4, 4); }
      }
      for (i = 0; i < pops.length; i++) {
        var pp = pops[i];
        if (pp.coinPop) { ctx.drawImage(coinSprs[1], Math.round(pp.x - camX), Math.round(pp.y)); continue; }
        if (!pp.txt) continue;
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText(pp.txt, Math.round(pp.x - camX), Math.round(pp.y));
      }
    }
    function drawPlayer() {
      if (state === 'clear' && clearPhase >= 2 && clearTimer > 6) return;
      var p = player;
      if (p.inv > 0 && Math.floor(frame / 3) % 2 === 0 && state === 'play') return; // blink
      var set = p.form === 2 ? SPR.fire : (p.form === 1 ? SPR.big : SPR.small);
      var spr;
      if (!p.onGround && state !== 'dead') spr = set.jump;
      else if (Math.abs(p.vx) > 0.15) {
        var cyc = set.runC ? [set.runA, set.runC, set.runB, set.runC] : [set.runA, set.runB];
        spr = cyc[Math.floor(p.animT / 4) % cyc.length];
      }
      else spr = set.stand;
      var dx = Math.round(p.x + p.w / 2 - spr.width / 2 - camX);
      var dy = Math.round(p.y + p.h - spr.height);
      ctx.save();
      if (p.face < 0 || state === 'dead') {
        ctx.translate(dx + spr.width / 2, 0); ctx.scale(p.face < 0 ? -1 : 1, 1); ctx.translate(-(dx + spr.width / 2), 0);
        if (state === 'dead') { ctx.translate(0, dy + spr.height / 2); ctx.translate(0, 0); }
      }
      ctx.drawImage(spr, dx, dy);
      ctx.restore();
    }
    function drawHUD() {
      ctx.font = '8px "Press Start 2P", monospace';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowOffsetY = 1; ctx.shadowOffsetX = 0;
      ctx.fillText('MALI', 12, 12);
      ctx.fillText(pad6(score), 12, 22);
      ctx.drawImage(coinSprs[0], 84, 13);
      ctx.fillText('x' + pad2(coinCount), 100, 22);
      ctx.drawImage(SPR.small.stand, 148, 5, 12, 12);
      ctx.fillText('x' + Math.max(0, lives), 162, 22);
      ctx.fillText('WORLD', VW / 2 - 20, 12);
      ctx.fillText('1-' + level, VW / 2 - 10, 22);
      ctx.fillText('TIME', VW - 52, 12);
      var ts = '' + Math.max(0, timeLeft); while (ts.length < 3) ts = '0' + ts;
      if (timeLeft <= 50 && state === 'play' && Math.floor(frame / 20) % 2 === 0) ctx.fillStyle = '#ff5a4a';
      ctx.fillText(ts, VW - 48, 22);
      ctx.shadowOffsetY = 0;
    }
    function render() {
      drawBackground();
      drawCastle();
      drawFlag();
      drawTiles();
      drawEntities();
      drawPlayer();
      drawHUD();
      if (state === 'intro') {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
        ctx.fillStyle = '#fff';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('WORLD 1-' + level, VW / 2, 94);
        ctx.drawImage(SPR.small.stand, VW / 2 - 24, 112);
        ctx.fillText('x  ' + lives, VW / 2 + 10, 122);
        ctx.fillStyle = '#9a97ad';
        ctx.fillText('READY', VW / 2, 156);
        ctx.textAlign = 'left';
      }
      if (state === 'title') {
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, VW, VH);
      }
    }

    /* ---------------- panels / flow ---------------- */
    var titlePanel = document.getElementById('titlePanel');
    var msgPanel = document.getElementById('msgPanel');
    var msgTitle = document.getElementById('msgTitle');
    var msgBody = document.getElementById('msgBody');
    var msgBtn = document.getElementById('msgBtn');
    var msgBtn2 = document.getElementById('msgBtn2');
    var pausePanel = document.getElementById('pausePanel');
    var msgMode = 'next';

    function showMsg(title, bodyHTML, btnLabel, showSecond, mode) {
      msgTitle.textContent = title;
      msgBody.innerHTML = bodyHTML;
      msgBtn.textContent = btnLabel;
      msgBtn2.textContent = mode === 'continue' ? '从头开始' : '重新开始';
      msgBtn2.style.display = showSecond ? '' : 'none';
      msgMode = mode || 'restart';
      msgPanel.hidden = false;
    }
    function hideMsg() { msgPanel.hidden = true; }
    function beginLevel() {
      bgmStop();
      state = 'intro'; introTimer = 0;
    }
    function msgPrimary() {
      hideMsg();
      audio();
      if (msgMode === 'next') { level++; resetLevel(0); }
      else if (msgMode === 'continue') { lives = START_LIVES; resetLevel(0); }
      else fullReset();
      beginLevel();
    }
    msgBtn.addEventListener('click', msgPrimary);
    msgBtn2.addEventListener('click', function () { hideMsg(); audio(); fullReset(); beginLevel(); });

    function startGame() {
      audio();
      titlePanel.hidden = true;
      hideMsg();
      fullReset();
      beginLevel();
    }
    document.getElementById('btnStart').addEventListener('click', startGame);

    var paused = false;
    function togglePause() {
      if (state !== 'play' && !paused) return;
      paused = !paused;
      pausePanel.hidden = !paused;
      if (paused) { prevState = state; state = 'pause'; bgmStop(); }
      else { state = 'play'; pausePanel.hidden = true; if (soundOn) bgmStart(); }
    }
    document.getElementById('btnPause').addEventListener('click', togglePause);
    document.getElementById('btnResume').addEventListener('click', togglePause);

    var btnSound = document.getElementById('btnSound');
    btnSound.addEventListener('click', function () {
      soundOn = !soundOn;
      btnSound.classList.toggle('off', !soundOn);
      if (!soundOn) bgmStop();
      else if (state === 'play') { audio(); bgmStart(); }
    });
    /* Portrait viewport: rotate the whole app 90deg (CSS on #rot) so the
       game is always landscape and fills the screen. The frame size is
       pinned in px to the real viewport (long side x short side) so it
       fills the screen even in webviews where dvh/dvw units lag. */
    var rotEl = document.getElementById('rot');
    function checkOrient() {
      var port = window.innerHeight > window.innerWidth;
      document.body.classList.toggle('portrait', port);
      document.body.classList.toggle('rotated', port);
      if (port) {
        rotEl.style.width = window.innerHeight + 'px';
        rotEl.style.height = window.innerWidth + 'px';
      } else {
        rotEl.style.width = '';
        rotEl.style.height = '';
      }
      fit();
    }
    window.addEventListener('orientationchange', function () { setTimeout(checkOrient, 80); });
    window.addEventListener('resize', checkOrient);
    checkOrient();

    /* ---------------- sizing ---------------- */
    var screenEl = document.getElementById('screen');
    var stageEl = document.getElementById('stage');
    function fit() {
      if (!stageEl || !stageEl.clientWidth) return;
      /* clientWidth/Height are layout (unrotated) sizes, so they stay
         correct when #rot is CSS-rotated in portrait. The canvas fills
         the stage height; the touch buttons float over the stage (on
         the black side bars, straddling the picture's edge), so no
         stage space is reserved for them. Snap the scale to fine 1/40
         steps so it stays close to the true fit on phone viewports.
         #screen adds a 3px border + 3px outline ring, hence -10. */
      var availW = stageEl.clientWidth - 10, availH = stageEl.clientHeight - 10;
      var raw = Math.min(availW / VW, availH / VH);
      var scale = Math.max(0.4, Math.floor(raw * 40) / 40);
      canvas.style.width = Math.floor(VW * scale) + 'px';
      canvas.style.height = Math.floor(VH * scale) + 'px';
    }
    window.addEventListener('resize', fit);

    /* ---------------- main loop ---------------- */
    fullReset();
    state = 'title';
    var last = 0, acc = 0, STEP = 1000 / 60;
    function loop(ts) {
      requestAnimationFrame(loop);
      if (!last) last = ts;
      var dt = ts - last; last = ts;
      if (dt > 250) dt = 250;
      acc += dt;
      while (acc >= STEP) {
        if (state !== 'pause') update();
        acc -= STEP;
      }
      render();
    }
    requestAnimationFrame(loop);
    fit();
    setTimeout(fit, 60);
    </script>
  </body>
</html>
